<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 390" width="820" height="390" role="img" aria-label="Praditya Full-Stack Developer Terminal Card">
  <style>
    .win-bg { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; }
    .bar-bg { fill: #161b22; }
    .title { fill: #8b949e; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; }
    .host { fill: #ff7b72; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 16px; font-weight: 700; text-decoration: underline; }
    .key { fill: #e6edf3; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13px; font-weight: 700; }
    .val { fill: #79c0ff; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13px; }
    .ascii { fill: #38bdf8; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; }
    .prompt { fill: #56d364; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13px; font-weight: 700; }
    .cursor { fill: #58a6ff; animation: blink 1s step-end infinite; }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .cursor { animation: none; opacity: 1; }
    }
  </style>

  
  <rect x="8" y="8" width="804" height="374" rx="12" class="win-bg" />
  <path d="M8 20 C8 13.4 13.4 8 20 8 L800 8 C806.6 8 812 13.4 812 20 L812 40 L8 40 Z" class="bar-bg" />
  <circle cx="28" cy="24" r="5.5" fill="#ff5f56" />
  <circle cx="46" cy="24" r="5.5" fill="#ffbd2e" />
  <circle cx="64" cy="24" r="5.5" fill="#27c93f" />
  <text x="410" y="28" text-anchor="middle" class="title">pradityasaputradev@github: ~</text>

  
  <g transform="translate(52, 75)">
