    </g>

    
    <g transform="translate(0, 232)">
      <text x="0" y="0" class="prompt">└─(praditya@github-[~])</text>
      <text x="0" y="18"><tspan class="prompt">└─$ </tspan><tspan class="val">full-stack web developer</tspan><tspan class="cursor" dx="2">▋</tspan></text>
    </g>
  </g>
</svg>
