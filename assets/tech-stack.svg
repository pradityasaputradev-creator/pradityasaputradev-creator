    <text x="0" y="148"><tspan class="key">Environment: </tspan><tspan class="val">Docker, Git, GitHub, VS Code</tspan></text>
    <text x="0" y="168"><tspan class="key">Contact.GitHub: </tspan><tspan class="val">github.com/pradityasaputradev-creator</tspan></text>

    
    <g transform="translate(0, 192)">
      <rect x="0" y="0" width="14" height="14" rx="2" fill="#21262d" stroke="#484f58" />
      <rect x="20" y="0" width="14" height="14" rx="2" fill="#f85149" />
      <rect x="40" y="0" width="14" height="14" rx="2" fill="#3fb950" />
