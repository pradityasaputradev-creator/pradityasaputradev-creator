  <g transform="translate(275, 72)">
    <text x="0" y="0" class="host">pradityasaputradev-creator@github</text>

    <text x="0" y="28"><tspan class="key">Role: </tspan><tspan class="val">Full-Stack Web Developer</tspan></text>
    <text x="0" y="48"><tspan class="key">Education: </tspan><tspan class="val">Informatics Student @ Universitas IPWIJA</tspan></text>
    <text x="0" y="68"><tspan class="key">Stack.Frontend: </tspan><tspan class="val">Blade, Tailwind CSS, HTML, CSS, JavaScript</tspan></text>
